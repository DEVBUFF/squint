name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Isolated data dir
        run: echo "SQUINT_HOME=$RUNNER_TEMP/squint-home" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/squint --strict
      - name: Helper CLI smoke test
        run: |
          python3 -m py_compile plugins/squint/scripts/squint.py
          python3 plugins/squint/scripts/squint.py init --project
          python3 plugins/squint/scripts/squint.py status
          python3 plugins/squint/scripts/squint.py trends
          python3 plugins/squint/scripts/squint.py detect .
          python3 plugins/squint/scripts/squint.py scan . --top 3
          python3 plugins/squint/scripts/squint.py new-audit
          python3 plugins/squint/scripts/squint.py hook
          bash -n plugins/squint/scripts/schedule.sh
      - name: Trend files follow the format
        run: python3 plugins/squint/scripts/squint.py check-trends
