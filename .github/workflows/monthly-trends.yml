# Researches design trends on the 1st of every month and opens a PR that updates the shipped
# trend base (knowledge/trends/<YYYY-MM>/). Runs on the maintainer's Claude subscription: create a token
# with `claude setup-token` and save it as the CLAUDE_CODE_OAUTH_TOKEN repository secret.
# Users receive merged updates via `claude plugin update squint@squint`.
name: Monthly trend research

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma list: web,ios,android,branding"
        default: "web,ios,android,branding"
      force:
        description: "Refresh even if this month's files are fresh"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Isolated data dir
        run: echo "SQUINT_HOME=$RUNNER_TEMP/squint-home" >> "$GITHUB_ENV"

      - name: Period
        run: echo "PERIOD=$(date -u +%Y-%m)" >> "$GITHUB_ENV"

      - name: Load the plugin from a copy (Claude Code protects a loaded plugin's files)
        run: |
          rsync -a --exclude .git ./ "$RUNNER_TEMP/squint-plugin/"
          echo "SQUINT_REPO_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Research with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /squint:research ${{ inputs.platforms || 'web,ios,android,branding' }} --repo --period ${{ env.PERIOD }}${{ inputs.force && ' --force' || '' }}
            This is a non-interactive CI run inside the plugin's own repository: never ask questions,
            refresh whatever is missing or stale, and only write under knowledge/trends/.
          claude_args: |
            --plugin-dir ${{ runner.temp }}/squint-plugin
            --add-dir ${{ runner.temp }}/squint-plugin
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Task,Skill,TodoWrite,Bash(python3 *),mcp__plugin_squint_exa__web_search_exa,mcp__plugin_squint_exa__web_fetch_exa"

      - name: Bump plugin version when the knowledge changed
        run: |
          if [ -n "$(git status --porcelain knowledge/)" ]; then
            python3 - <<'EOF'
          import json
          p = ".claude-plugin/plugin.json"
          d = json.load(open(p))
          a, b, c = map(int, d["version"].split("."))
          d["version"] = f"{a}.{b}.{c + 1}"
          with open(p, "w") as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("version ->", d["version"])
          EOF
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: trends/${{ env.PERIOD }}
          commit-message: "trends: ${{ env.PERIOD }} research"
          title: "Trends: ${{ env.PERIOD }}"
          body: |
            Monthly design-trend research for ${{ env.PERIOD }} (web, iOS, Android, branding).
            Review `knowledge/trends/${{ env.PERIOD }}/summary.md` first, spot-check sources, then merge.
          add-paths: |
            knowledge/trends/**
            .claude-plugin/plugin.json
